<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getFunctions } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';
        import { firebaseConfig } from './firebase-config.js';
        const app = initializeApp(firebaseConfig);
        window.firebase = {
            app,
            db: getFirestore(app),
            functions: getFunctions(app)
        };
    </script>
</head>
<body style="background-color: var(--bg-secondary); padding: 40px; text-align: center;">
    <div style="max-width: 600px; margin: 0 auto; background: var(--bg-primary); padding: 40px; border-radius: 8px; border: 1px solid var(--border-color);">
        <h1 style="color: var(--text-primary); margin-bottom: 20px;">Email Verification</h1>
        <p style="color: var(--text-secondary); margin-bottom: 30px;">
            Please check your email and click the verification link to complete your account setup.
        </p>
        <a href="login.html" class="btn-primary" style="text-decoration: none; display: inline-block;">Return to Login</a>
    </div>
</body>
</html>
