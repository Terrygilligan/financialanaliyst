<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Account Recovery - AI Financial Analyst">
    <title>Reset Password - AI Financial Analyst</title>
    <link rel="stylesheet" href="styles.css?v=20251231-design-final">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { firebaseConfig } from './firebase-config.js';
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make available globally
        window.firebase = { app, auth, db };
    </script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .recovery-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .recovery-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .recovery-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }
        .recovery-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .recovery-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .success-message {
            background-color: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="recovery-container">
        <div class="recovery-header">
            <h1>🔐 Reset Password</h1>
            <p>Enter your email to receive a tenant-aware reset link.</p>
        </div>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form id="recovery-form" class="recovery-form">
            <div class="form-group">
                <label for="email-input">Email Address</label>
                <input type="email" id="email-input" placeholder="you@company.com" required>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Send Reset Link</button>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script type="module" src="forgot-password.js"></script>
</body>
</html>
